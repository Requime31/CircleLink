name: Bug report
description: Report reproducible incorrect behavior in CircleLink.
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Affected version or build
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or other evidence
  - type: dropdown
    id: regression
    attributes:
      label: Regression
      options: ["Yes", "No", "Unknown"]
    validations:
      required: true
