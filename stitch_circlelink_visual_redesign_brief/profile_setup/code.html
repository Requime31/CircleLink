<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcf9f8;
            color: #1c1b1b;
            -webkit-font-smoothing: antialiased;
        }
        .hairline {
            border: 1px solid rgba(136, 114, 108, 0.2);
        }
        .avatar-sq {
            border-radius: 20px;
        }
        .tap-highlight-none {
            -webkit-tap-highlight-color: transparent;
        }
        .soft-elevation {
            box-shadow: 0px 4px 20px rgba(28, 27, 27, 0.04);
        }

<body class="bg-surface min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="docked full-width top-0 border-b border-outline-variant/30 flex justify-between items-center w-full px-margin-mobile h-14 bg-surface fixed z-40">

<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-low transition-colors p-2 rounded-full">
            settings
        </button>
</header>
<main class="w-full max-w-md px-margin-mobile pt-20 pb-32 flex flex-col gap-8">
<!-- Step Indicator -->

<!-- Section: Identity -->
<section class="flex flex-col gap-6">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Let's build your profile</h2>
<div class="flex flex-col items-center gap-4">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 avatar-sq bg-surface-container-high flex items-center justify-center hairline overflow-hidden relative">
<img class="w-full h-full object-cover opacity-80" data-alt="Profile placeholder" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD2pS0UuvIUY606E7T38qFFmJ7z29ZIE2oRnTtNbDlc-lLXsarE1YJT7bOebEJFvK4okGr8OgPp4vhO___UzCONaSPhZ7O7V6koy9UOyx5BVWcsadVILD7109Ube5WLL6DSkTmuUqxmroBRAiVgiyag1rEC24XcpveT6pIrfyHvpXMJ4tmqOu4cgnrcTCU-o1MrUmUdEUPpGVpsAM6_J3636YOnOgZFwO5akDC6DHv0QkxQnfEAECU">
<div class="absolute inset-0 flex items-center justify-center bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-surface">photo_camera</span>
</div>
</div>
<div class="absolute -bottom-1 -right-1 bg-primary-container text-white p-1.5 rounded-full hairline soft-elevation">
<span class="material-symbols-outlined text-[18px]">add_a_photo</span>
</div>
</div>
<p class="font-label-md text-label-md text-secondary">Tap to upload photo</p>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="display-name">Display Name</label>
<input class="w-full h-12 px-4 rounded-xl border border-outline-variant/50 bg-white focus:outline-none focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all font-body-md text-body-md placeholder:text-secondary-fixed-dim" id="display-name" placeholder="How should we call you?" type="text">
</div>
</section>
<!-- Section: Interests -->
<section class="flex flex-col gap-4">
<div class="flex flex-col gap-1">
<h3 class="font-headline-md text-headline-md text-on-surface">Interests</h3>
<p class="font-body-md text-body-md text-secondary">Pick at least 3 interests to help us connect you with local circles.</p>
</div>
<div class="flex flex-wrap gap-2 pt-2" id="interest-container">
<button class="interest-chip h-10 px-4 rounded-full border border-outline-variant/30 bg-white font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-all tap-highlight-none flex items-center gap-2" onclick="toggleChip(this)">
                    Gardening
                </button>
<button class="interest-chip h-10 px-4 rounded-full border border-outline-variant/30 bg-white font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-all tap-highlight-none flex items-center gap-2" onclick="toggleChip(this)">
                    Sci-Fi
                </button>
<button class="interest-chip h-10 px-4 rounded-full border border-outline-variant/30 bg-white font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-all tap-highlight-none flex items-center gap-2" onclick="toggleChip(this)">
                    Coffee
                </button>
<button class="interest-chip h-10 px-4 rounded-full border border-outline-variant/30 bg-white font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-all tap-highlight-none flex items-center gap-2" onclick="toggleChip(this)">
                    Hiking
                </button>
<button class="interest-chip h-10 px-4 rounded-full border border-outline-variant/30 bg-white font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-all tap-highlight-none flex items-center gap-2" onclick="toggleChip(this)">
                    Cooking
                </button>
<button class="interest-chip h-10 px-4 rounded-full border border-outline-variant/30 bg-white font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-all tap-highlight-none flex items-center gap-2" onclick="toggleChip(this)">
                    Jazz
                </button>
<button class="interest-chip h-10 px-4 rounded-full border border-outline-variant/30 bg-white font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-all tap-highlight-none flex items-center gap-2" onclick="toggleChip(this)">
                    Pottery
                </button>
<button class="interest-chip h-10 px-4 rounded-full border border-outline-variant/30 bg-white font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-all tap-highlight-none flex items-center gap-2" onclick="toggleChip(this)">
                    Meditation
                </button>
<button class="interest-chip h-10 px-4 rounded-full border border-outline-variant/30 bg-white font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-all tap-highlight-none flex items-center gap-2" onclick="toggleChip(this)">
                    Board Games
                </button>
</div>
</section>
</main>
<!-- Fixed CTA Button Container -->
<div class="fixed bottom-0 left-0 right-0 p-margin-mobile bg-gradient-to-t from-surface via-surface/95 to-transparent pt-8 flex justify-center pointer-events-none z-40">
<button class="pointer-events-auto w-full max-w-md h-14 bg-primary-container text-white font-headline-md text-headline-md rounded-full soft-elevation active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-lg shadow-primary-container/20 opacity-50 grayscale" disabled="" id="main-cta">
            Save &amp; Continue
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<script>
        function toggleChip(button) {
            const isSelected = button.classList.contains('selected');
            
            if (isSelected) {
                // Deselect
                button.classList.remove('selected', 'bg-primary-container/15', 'text-on-primary-container', 'border-primary-container/40');
                button.classList.add('bg-white', 'text-on-surface-variant', 'border-outline-variant/30');
                const icon = button.querySelector('.chip-icon');
                if (icon) icon.remove();
            } else {
                // Select
                button.classList.add('selected', 'bg-primary-container/15', 'text-on-primary-container', 'border-primary-container/40');
                button.classList.remove('bg-white', 'text-on-surface-variant', 'border-outline-variant/30');
                
                const icon = document.createElement('span');
                icon.className = 'material-symbols-outlined chip-icon text-[16px]';
                icon.textContent = 'check';
                button.prepend(icon);
            }
            
            checkProgress();
        }

        function checkProgress() {
            const selectedCount = document.querySelectorAll('.interest-chip.selected').length;
            const cta = document.getElementById('main-cta');
            const nameInput = document.getElementById('display-name').value;

            if (selectedCount >= 3 && nameInput.trim().length >= 2) {
                cta.classList.remove('opacity-50', 'grayscale');
                cta.disabled = false;
            } else {
                cta.classList.add('opacity-50', 'grayscale');
                cta.disabled = true;
            }
        }

        document.getElementById('display-name').addEventListener('input', checkProgress);
        
        // Initial check on load
        document.addEventListener('DOMContentLoaded', checkProgress);
    </script>


</body></html>
