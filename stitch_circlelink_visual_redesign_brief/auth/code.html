<style>
        body {
            background-color: #fcf9f8;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .hairline {
            border: 0.5px solid rgba(136, 114, 108, 0.2);
        }

        .tap-highlight-none {
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen selection:bg-primary-container/30">
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile relative min-h-screen">
<!-- Ambient subtle background hint -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-30">
<div class="absolute top-[-10%] left-[-10%] w-1/2 h-1/2 bg-terracotta/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-5%] right-[-5%] w-1/3 h-1/3 bg-secondary/5 blur-[100px] rounded-full"></div>
</div>
<div class="w-full max-w-sm z-10 flex flex-col items-center text-center">
<!-- Logo Mark -->
<div class="mb-10 animate-float">
<div class="w-16 h-16 rounded-xl bg-surface-container-lowest hairline flex items-center justify-center shadow-[0px_4px_20px_rgba(155,68,42,0.08)]">
<span class="material-symbols-outlined text-terracotta text-[32px]" style="font-variation-settings: 'FILL' 1;">
                        diversity_3
                    </span>
</div>
</div>
<!-- Typography Cluster -->
<div class="space-y-sm mb-xl">
<h2 class="font-display text-display text-primary tracking-tight mb-xs">CircleLink</h2><h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">
                    Find your circle.
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    Low-stress social discovery.
                </p>
</div>
<!-- Action Cluster -->
<div class="w-full space-y-md">
<!-- Apple Sign In -->
<button class="w-full h-14 bg-[#000000] rounded-xl flex items-center justify-center space-x-sm tap-highlight-none active:scale-[0.98] transition-all duration-200">
<svg class="w-5 h-5 fill-white" preserveAspectRatio="xMidYMid" viewBox="0 0 256 315" xmlns="http://www.w3.org/2000/svg">
<path d="M213.803 167.03c.442 47.58 41.74 63.413 42.197 63.615-.35 1.116-6.599 22.563-21.757 44.716-13.104 19.153-26.705 38.235-48.13 38.63-21.05.388-27.82-12.483-51.888-12.483-24.053 0-31.582 12.088-51.512 12.875-20.68.783-36.406-20.57-49.623-39.592-27.051-39.006-47.61-110.156-19.626-158.59 13.893-24.045 38.66-39.267 65.524-39.665 20.3-.393 39.46 13.671 51.89 13.671 12.439 0 35.636-16.895 59.948-14.41 10.187.426 38.8 4.135 57.198 31.136-1.49.911-34.138 19.888-34.138 59.703m-46.772-114.792c10.83-13.14 18.113-31.412 16.124-49.627-15.633.646-34.524 10.387-45.716 23.526-10.04 11.66-18.826 30.291-16.45 48.06 17.433 1.344 35.212-8.819 46.042-21.959"></path>
</svg>
<span class="text-white font-semibold text-[17px] tracking-tight">Sign in with Apple</span>
</button>
<!-- Email Sign In -->
<button class="w-full h-14 bg-white hairline rounded-xl flex items-center justify-center tap-highlight-none active:bg-surface-container-low transition-colors duration-200">
<span class="text-on-surface font-medium text-body-lg">Continue with Email</span>
</button>
<!-- Spacer for layout balance -->
<div class="h-xs"></div>
<!-- Small Login Hint -->
<p class="font-label-md text-label-md text-on-surface-variant">
                    Already have an account? <span class="text-terracotta font-semibold">Log in</span>
</p>
</div>
<p class="font-label-sm text-label-sm text-outline max-w-xs mx-auto leading-relaxed mt-xl">
                By continuing, you agree to CircleLink's 
                <span class="underline underline-offset-2">Terms of Service</span> and 
                <span class="underline underline-offset-2">Privacy Policy</span>.
            </p>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', function() {
                this.classList.add('scale-95');
            });
            btn.addEventListener('touchend', function() {
                this.classList.remove('scale-95');
            });
        });
    </script>
