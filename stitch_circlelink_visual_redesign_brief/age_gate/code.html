                    "on-secondary-fixed-variant": "#4e4541",
                    "tertiary": "#5e5e5d",

                    "surface-container-low": "#f6f3f2",
                    "secondary-container": "#ebddd7",
                    "on-tertiary": "#ffffff",
                    "on-secondary-container": "#6a615c",
                    "inverse-primary": "#ffb59f",
                    "on-tertiary-fixed-variant": "#464746",
                    "inverse-on-surface": "#f3f0ef",
                    "on-primary-fixed": "#3a0a00",
                    "inverse-surface": "#313030",

                    "on-background": "#1c1b1b",

                    "on-error-container": "#93000a",

                    "secondary-fixed": "#ede0da",
                    "surface-container-high": "#eae7e7",

                    "secondary": "#665c58",

                    "on-secondary-fixed": "#211a17",

            },
            "borderRadius": {

<style>
        body {
            background-color: #fcf9f8;
            -webkit-tap-highlight-color: transparent;
        }
        
        .hairline {
            border: 1px solid rgba(136, 114, 108, 0.15);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .soft-shadow {
            box-shadow: 0px 4px 20px rgba(28, 27, 27, 0.04);
        }

        input:focus {
            outline: none;
            border-color: #e67e5f !important;
            box-shadow: 0 0 0 1px #e67e5f;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen text-on-surface">
<main class="flex-grow flex items-center justify-center px-margin-mobile min-h-screen">
<div class="w-full max-w-md flex flex-col items-center text-center">
<!-- Logo Section -->
<div class="mb-xl flex justify-center">

</div>
<!-- Content Card -->
<div class="bg-surface-container-lowest hairline rounded-xl p-lg w-full flex flex-col items-center">
<!-- Icon/Avatar (Soft Rounded) -->
<div class="w-16 h-16 bg-primary-fixed rounded-xl flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-on-primary-fixed-variant text-3xl">cake</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg mb-xs text-on-surface">
                How old are you?
            </h1>
<p class="font-body-md text-body-md text-secondary mb-lg">
                CircleLink is for people 18 and older.
            </p>
<!-- Year Selection Component -->
<div class="w-full space-y-md mb-xl">
<div class="relative w-full">
<label class="sr-only" for="birthYear">Year of Birth</label>
<input class="w-full h-14 px-md bg-surface hairline rounded-lg font-body-lg text-body-lg text-center placeholder:text-secondary-fixed-dim transition-all duration-200" id="birthYear" max="2024" min="1900" placeholder="Year of birth (YYYY)" type="number">
</div>
</div>
<!-- Primary CTA - Updated to Terracotta -->
<button class="w-full h-14 bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded-xl scale-100 active:scale-95 active:opacity-90 transition-all soft-shadow flex items-center justify-center" id="continueBtn" style="background-color: #e67e5f; color: #ffffff;">
                Continue
            </button>
<!-- Small Privacy Disclaimer -->
<p class="mt-md font-label-sm text-label-sm text-on-secondary-fixed-variant px-md opacity-80">
                By continuing, you confirm that you meet our age requirements and agree to our Terms of Service.
            </p>
</div>
<!-- Decorative Elements -->
<div class="mt-xl opacity-20 pointer-events-none">
<div class="w-1.5 h-1.5 bg-primary-container rounded-full inline-block mx-1" style="background-color: #e67e5f;"></div>
<div class="w-1.5 h-1.5 bg-primary-container rounded-full inline-block mx-1" style="background-color: #e67e5f;"></div>
<div class="w-1.5 h-1.5 bg-primary-container rounded-full inline-block mx-1" style="background-color: #e67e5f;"></div>
</div>
</div>
</main>
<!-- Background Atmospheric Effect -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-fixed/15 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[30%] h-[30%] bg-secondary-fixed/15 blur-[100px] rounded-full"></div>
</div>
<script>
    const input = document.getElementById('birthYear');
    const button = document.getElementById('continueBtn');

    input.addEventListener('input', (e) => {
        const val = e.target.value;
        if (val.length === 4) {
            const year = parseInt(val);
            const currentYear = new Date().getFullYear();
            if (currentYear - year >= 18) {
                button.classList.remove('opacity-60');
                button.style.backgroundColor = '#e67e5f';
            } else {
                button.classList.add('opacity-60');
            }
        }
    });

    button.addEventListener('click', () => {
        const val = input.value;
        if (val.length !== 4) {
            input.classList.add('border-error');
            setTimeout(() => input.classList.remove('border-error'), 1000);
            return;
        }
        
        const year = parseInt(val);
        const currentYear = new Date().getFullYear();
        
        if (currentYear - year < 18) {
            alert("CircleLink is exclusively for users aged 18 and above.");
        } else {
            button.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            setTimeout(() => {
                button.innerHTML = '<span class="material-symbols-outlined">check</span>';
            }, 1000);
        }
    });
</script>




</body></html>
