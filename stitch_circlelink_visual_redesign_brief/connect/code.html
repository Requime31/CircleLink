<script>
        function swipeAction(direction) {
            const card = document.getElementById('cardStack');
            const translation = direction === 'left' ? '-150%' : '150%';
            const rotation = direction === 'left' ? '-20deg' : '20deg';
            
            card.style.transform = `translateX(${translation}) rotate(${rotation})`;
            card.style.opacity = '0';
            
            setTimeout(() => {
                // Reset card for demo purposes
                card.style.transition = 'none';
                card.style.transform = 'translateX(0) rotate(0)';
                card.style.opacity = '1';
                setTimeout(() => {
                    card.style.transition = 'transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), opacity 0.3s ease';
                }, 50);
            }, 600);
        }

        // Horizontal scroll utility for chips
        const scrollContainer = document.querySelector('.no-scrollbar');
        if (scrollContainer) {
            scrollContainer.addEventListener('wheel', (evt) => {
                evt.preventDefault();
                scrollContainer.scrollLeft += evt.deltaY;
            });
        }
    </script>
